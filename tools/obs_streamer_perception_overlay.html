<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QorTroller Streamer Perception</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: rgba(0,0,0,0);
      overflow: hidden;
      font-family: ui-monospace, Consolas, monospace;
      color: #e8e8e8;
    }
    #marker {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 120, 40, 0.9);
      border-radius: 4px;
      font-size: 12px;
      color: #fff;
      max-width: 420px;
      word-break: break-all;
    }
    #marker .label { color: #ff7828; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    #panel {
      margin: 60px 12px 12px 12px;
      padding: 12px 16px;
      min-width: 320px;
      max-width: 520px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 120, 40, 0.7);
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: #ff7828;
      text-transform: uppercase;
    }
    .row { font-size: 13px; line-height: 1.45; }
    .muted { color: #9aa0a6; font-size: 11px; margin-top: 8px; }
    .ok { color: #5dfea5; }
    .warn { color: #ffd166; }
    .bad { color: #ff6b6b; }
    #log {
      margin-top: 8px;
      max-height: 120px;
      overflow: hidden;
      font-size: 11px;
      color: #c5c8ce;
    }
  </style>
</head>
<body>
  <div id="marker">
    <div class="label">Session Marker</div>
    <div id="marker_text">—</div>
    <div id="marker_status" class="muted">—</div>
  </div>
  <div id="panel">
    <h1>Streamer Perception</h1>
    <div class="row">WS: <span id="ws">connecting…</span></div>
    <div class="row">Source: <span id="source">—</span></div>
    <div class="row">Activity: <span id="activity">—</span></div>
    <div class="row">Motion: <span id="motion">—</span> · FPS: <span id="fps">—</span></div>
    <div class="row">Zones: <span id="zones">—</span></div>
    <div class="row">Presence: <span id="presence">—</span></div>
    <div id="log"></div>
    <div class="muted">Advisory only — not humanity / tournament proof · eye-check game feed</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const wsUrl = params.get("ws") || "ws://127.0.0.1:8765";
    const wsEl = document.getElementById("ws");
    const activityEl = document.getElementById("activity");
    const motionEl = document.getElementById("motion");
    const fpsEl = document.getElementById("fps");
    const zonesEl = document.getElementById("zones");
    const sourceEl = document.getElementById("source");
    const presenceEl = document.getElementById("presence");
    const markerTextEl = document.getElementById("marker_text");
    const markerStatusEl = document.getElementById("marker_status");
    const logEl = document.getElementById("log");
    const zoneMap = {};

    function pushLog(line) {
      const d = document.createElement("div");
      d.textContent = line;
      logEl.prepend(d);
      while (logEl.childNodes.length > 8) logEl.removeChild(logEl.lastChild);
    }

    function setClass(el, className) { el.className = className; }

    function connect() {
      const ws = new WebSocket(wsUrl);
      wsEl.textContent = wsUrl + " …";
      wsEl.className = "warn";
      ws.onopen = () => {
        wsEl.textContent = "connected";
        wsEl.className = "ok";
      };
      ws.onclose = () => {
        wsEl.textContent = "disconnected — retry";
        wsEl.className = "bad";
        setTimeout(connect, 1500);
      };
      ws.onerror = () => { wsEl.className = "bad"; };
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        const t = msg.type;
        const p = msg.payload || {};
        const src = msg.source || {};

        if (msg.session_id) {
          markerTextEl.textContent = msg.session_id;
        }
        if (p.marker_text) {
          markerTextEl.textContent = p.marker_text;
        }
        if (src && (src.device !== undefined || src.kind)) {
          sourceEl.textContent = (src.kind || "?") + " / " + (src.device !== undefined ? src.device : "?");
        }

        if (t === "activity") {
          activityEl.textContent = p.level || "—";
          activityEl.className = p.level === "high" ? "ok" : (p.level === "idle" ? "muted" : "warn");
          motionEl.textContent = p.motion != null ? p.motion : motionEl.textContent;
          presenceEl.textContent = (p.presence_sync_ok === true) ? "sync" : (p.presence_sync_ok === false ? "optical-only" : "—");
          pushLog("activity → " + p.level + (p.presence_sync_ok ? " (sync)" : ""));
        } else if (t === "frame_stats") {
          if (p.motion != null) motionEl.textContent = p.motion;
          if (p.fps_meas != null) fpsEl.textContent = p.fps_meas;
          if (p.activity) activityEl.textContent = p.activity;
          if (p.presence_sync_ok != null) presenceEl.textContent = p.presence_sync_ok ? "sync" : "optical-only";
        } else if (t === "zone") {
          zoneMap[p.zone_id] = p.state;
          zonesEl.textContent = Object.entries(zoneMap).map(([k,v]) => k + ":" + v).join(" · ") || "—";
          pushLog("zone " + p.zone_id + " → " + p.state);
        } else if (t === "session_marker") {
          markerStatusEl.textContent = (p.match === true) ? "match (" + p.method + ")" : (p.match === false ? "mismatch (" + p.method + ")" : "no decode");
          markerStatusEl.className = (p.match === true) ? "ok" : (p.match === false ? "bad" : "warn");
        } else if (t === "heartbeat") {
          /* quiet */
        } else if (t === "session_start") {
          pushLog("session start");
        } else if (t === "session_end") {
          pushLog("session end frames=" + (p.frames || "?"));
        } else if (t === "source_secondary_failed") {
          pushLog("secondary failed: " + (p.error || ""));
        }
      };
    }
    connect();
  </script>
</body>
</html>
